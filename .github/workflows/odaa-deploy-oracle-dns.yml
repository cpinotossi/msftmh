name: 07 - Deploy Oracle DNS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: workshop-stage-07-oracle-dns
  cancel-in-progress: false

jobs:
  oracle:
    uses: ./.github/workflows/odaa-require-oracle-subscription.yml
  dns:
    needs: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and Check Static Oracle DNS Configuration
        run: |
          az bicep build-params --file infra/deployments/07-oracle-dns.bicepparam \
            --outfile "$RUNNER_TEMP/oracle-dns.parameters.json"
          python3 -c '
          import json, os, re
          with open(os.path.join(os.environ["RUNNER_TEMP"], "oracle-dns.parameters.json")) as source:
              parameters = json.load(source)["parameters"]
          domain = parameters["oracleDnsZoneName"]["value"]
          if domain.endswith(".") or len(domain) > 253 or not all(
              re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?", label)
              for label in domain.split(".")):
              raise SystemExit("Fill the actual Oracle-created Azure private DNS zone without a trailing dot")
          '
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: '8fd3e0b6-0302-4084-a31f-1dfc5bbd03f5'
          subscription-id: '4ce5b5cc-e869-451f-98fc-f50448849ee0'
      - name: Link the existing replicated Oracle DNS zone to the hub
        run: |
          az deployment group create --name workshop-07-oracle-dns \
            --resource-group rg-odaa-shared \
            --subscription 4ce5b5cc-e869-451f-98fc-f50448849ee0 \
            --template-file infra/deployments/07-oracle-dns.bicep \
            --parameters @"$RUNNER_TEMP/oracle-dns.parameters.json" \
            --output none
