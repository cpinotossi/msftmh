name: 03 - Deploy Seven User Networks

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: workshop-stage-03-users
  cancel-in-progress: false

env:
  ARM_TENANT_ID: '8fd3e0b6-0302-4084-a31f-1dfc5bbd03f5'
  WORKSHOP_SUBSCRIPTION_ID: 'aca3d6b0-497a-40cc-bdd0-e8e3ef6d8483'

jobs:
  identity:
    uses: ./.github/workflows/odaa-read-identity.yml
  users:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Static User Configuration
        run: |
          az bicep build-params --file infra/deployments/03-users.bicepparam \
            --outfile "$RUNNER_TEMP/users.parameters.json"
      - name: Validate Static Configuration and Map Seven IDs
        id: participants
        env:
          IDENTITY_OBJECT_IDS: ${{ needs.identity.outputs.user_object_ids }}
        run: |
          python3 -c '
          import ipaddress, json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "users.parameters.json")) as source:
              parameters = json.load(source)["parameters"]
          firewall = ipaddress.ip_address(parameters["firewallPrivateIp"]["value"])
          if firewall.version != 4 or not firewall.is_private:
              raise SystemExit("Set the actual hub firewall private IPv4 address in 03-users.bicepparam")
          identity = json.loads(os.environ["IDENTITY_OBJECT_IDS"])
          names = {"01":"mhuser1", "02":"mhuser2", "03":"mhuser3", "04":"mhuser4",
                   "05":"mhuser5", "06":"mhuser6", "07":"mhuser7"}
          if set(identity) != set(names):
              raise SystemExit("Exactly seven verified directory IDs are required")
          users = {names[key]: identity[key] for key in names}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("user_object_ids=" + json.dumps(users, separators=(",", ":")) + "\n")
          '
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.WORKSHOP_SUBSCRIPTION_ID }}
      - name: Deploy Seven User Networks Only
        env:
          GROUP_ID: ${{ needs.identity.outputs.group_id }}
          USER_OBJECT_IDS: ${{ steps.participants.outputs.user_object_ids }}
        run: |
          test -n "$GROUP_ID"
          az deployment sub create --name workshop-03-users --location francecentral \
            --subscription "$WORKSHOP_SUBSCRIPTION_ID" \
            --template-file infra/deployments/03-users.bicep \
            --parameters @"$RUNNER_TEMP/users.parameters.json" \
              workshopGroupId="$GROUP_ID" userObjectIds="$USER_OBJECT_IDS" \
            --output none
