name: Test BaseDB - Phase B only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_PHASE_B_BASEDB_TEST after organizer approval of stages 04 through 07'
        type: string
        required: true
      participant:
        description: 'One existing participant VM; the test also creates a temporary hub DNS diagnostic VM'
        type: choice
        options: ['01', '02', '03', '04', '05', '06', '07']
        default: '01'
        required: true
      db_shape:
        description: 'Exact regional Single Node shape'
        type: string
        default: 'VM.BaseDB.x86'
        required: true
      db_version:
        description: 'Exact regional database version; no fallback'
        type: string
        default: '26.0.0.0.0'
        required: true
      availability_zone:
        description: 'Must match the existing central network anchor zone'
        type: string
        required: true
      compute_model:
        type: choice
        options: [ECPU, OCPU]
        default: ECPU
        required: true
      compute_count:
        type: number
        default: 4
        required: true
      storage_gb:
        type: number
        default: 256
        required: true

concurrency:
  group: workshop-basedb-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  WORKSHOP_TENANT_ID: 8fd3e0b6-0302-4084-a31f-1dfc5bbd03f5
  WORKSHOP_SUBSCRIPTION_ID: aca3d6b0-497a-40cc-bdd0-e8e3ef6d8483
  ODAA_SUBSCRIPTION_ID: 4ce5b5cc-e869-451f-98fc-f50448849ee0
  BASE_DB_SHAPE: ${{ inputs.db_shape }}
  BASE_DB_VERSION: ${{ inputs.db_version }}
  BASE_DB_ZONE: ${{ inputs.availability_zone }}
  BASE_DB_COMPUTE_MODEL: ${{ inputs.compute_model }}
  BASE_DB_COMPUTE: ${{ inputs.compute_count }}
  BASE_DB_STORAGE: ${{ inputs.storage_gb }}
  BASE_DB_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  phase-b-guard:
    runs-on: ubuntu-latest
    outputs:
      participant_name: ${{ steps.participant.outputs.participant_name }}
      vm_name: ${{ steps.participant.outputs.BASE_DB_VM_NAME }}
      vm_rg: ${{ steps.participant.outputs.BASE_DB_VM_RG }}
      db_rg: ${{ steps.participant.outputs.BASE_DB_RESOURCE_GROUP }}
      db_name: ${{ steps.participant.outputs.BASE_DB_NAME }}
    steps:
      - name: Block before Phase B without login or Oracle access
        env:
          PHASE_B_READY: ${{ vars.WORKSHOP_PHASE_B_READY }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$PHASE_B_READY" == true && "$CONFIRMATION" == RUN_PHASE_B_BASEDB_TEST ]] ||
            { echo 'BLOCKED: Phase A has no Oracle dependency. Organizer must approve Phase B first.'; exit 1; }
      - uses: actions/checkout@v4
      - name: Select the static participant scope
        id: participant
        env:
          PARTICIPANT_INDEX: ${{ inputs.participant }}
        run: python3 tests/export_shared_config.py --participant "$PARTICIPANT_INDEX"

  test-base-database:
    needs: phase-b-guard
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Configure separate secrets in each mhuserN GitHub environment.
    environment: ${{ needs.phase-b-guard.outputs.participant_name }}
    env:
      BASE_DB_VM_NAME: ${{ needs.phase-b-guard.outputs.vm_name }}
      BASE_DB_VM_RG: ${{ needs.phase-b-guard.outputs.vm_rg }}
      BASE_DB_RESOURCE_GROUP: ${{ needs.phase-b-guard.outputs.db_rg }}
      BASE_DB_NAME: ${{ needs.phase-b-guard.outputs.db_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.WORKSHOP_TENANT_ID }}
          subscription-id: ${{ env.WORKSHOP_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCI control-plane client
        run: python3 -m pip install 'oci-cli==3.96.0'
      - name: Verify both subscription tenants
        run: |
          set -euo pipefail
          for subscription in "$WORKSHOP_SUBSCRIPTION_ID" "$ODAA_SUBSCRIPTION_ID"; do
            [[ "$(az account show --subscription "$subscription" --query tenantId -o tsv)" == "$WORKSHOP_TENANT_ID" ]]
          done
      - name: Read successful canonical ARM deployment outputs (no Terraform state)
        env:
          HUB_DEPLOYMENT_ID: ${{ vars.WORKSHOP_HUB_DEPLOYMENT_ID }}
          NETWORK_DEPLOYMENT_ID: ${{ vars.WORKSHOP_ORACLE_NETWORK_DEPLOYMENT_ID }}
          ANCHOR_DEPLOYMENT_ID: ${{ vars.WORKSHOP_NETWORK_ANCHOR_DEPLOYMENT_ID }}
          DNS_DEPLOYMENT_ID: ${{ vars.WORKSHOP_ORACLE_DNS_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          : "${HUB_DEPLOYMENT_ID:?Required canonical stage 02 deployment ID}"
          : "${NETWORK_DEPLOYMENT_ID:?Required canonical stage 04 deployment ID}"
          : "${ANCHOR_DEPLOYMENT_ID:?Required canonical stage 06 deployment ID}"
          : "${DNS_DEPLOYMENT_ID:?Required canonical stage 07 deployment ID}"
          python3 tests/export_shared_config.py \
            --deployment-id "$HUB_DEPLOYMENT_ID" \
            --deployment-id "$NETWORK_DEPLOYMENT_ID" \
            --deployment-id "$ANCHOR_DEPLOYMENT_ID" \
            --deployment-id "$DNS_DEPLOYMENT_ID"
      - name: Read existing VM subnet and verify central anchor before provisioning
        run: |
          set -euo pipefail
          nic_id="$(az vm show --subscription "$WORKSHOP_SUBSCRIPTION_ID" \
            --resource-group "$BASE_DB_VM_RG" --name "$BASE_DB_VM_NAME" \
            --query 'networkProfile.networkInterfaces[0].id' -o tsv)"
          [[ -n "$nic_id" ]]
          subnet_id="$(az network nic show --ids "$nic_id" \
            --query 'ipConfigurations[0].subnet.id' -o tsv)"
          prefix="/subscriptions/$WORKSHOP_SUBSCRIPTION_ID/resourceGroups/$BASE_DB_VM_RG/providers/Microsoft.Network/virtualNetworks/"
          [[ "${subnet_id,,}" == "${prefix,,}"*/subnets/* ]]
          vnet_id="${subnet_id%/subnets/*}"
          echo "BASE_DB_VM_VNET_NAME=${vnet_id##*/}" >> "$GITHUB_ENV"
          python3 tests/base_database.py anchor-check
          python3 tests/base_database.py preflight
      - name: Grant scoped topology Reader to the selected VM identity
        run: |
          set -euo pipefail
          principal="$(az vm show --subscription "$WORKSHOP_SUBSCRIPTION_ID" \
            --resource-group "$BASE_DB_VM_RG" --name "$BASE_DB_VM_NAME" \
            --query identity.principalId -o tsv)"
          [[ "$principal" =~ ^[0-9a-fA-F-]{36}$ ]]
          for scope in \
            "/subscriptions/$WORKSHOP_SUBSCRIPTION_ID/resourceGroups/$BASE_DB_VM_RG" \
            "/subscriptions/$WORKSHOP_SUBSCRIPTION_ID/resourceGroups/rg-workshop-hub" \
            "/subscriptions/$ODAA_SUBSCRIPTION_ID/resourceGroups/$BASE_DB_RESOURCE_GROUP"; do
            subscription="${scope#/subscriptions/}"
            subscription="${subscription%%/*}"
            name="$(python3 -c 'import sys, uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, sys.argv[1].lower()))' "$scope/$principal/reader")"
            az role assignment create --subscription "$subscription" \
              --assignee-object-id "$principal" --assignee-principal-type ServicePrincipal \
              --role acdd72a7-3385-48ef-bd42-f606fba81ae7 \
              --scope "$scope" --name "$name" --output none
          done
      - name: Validate separate secure SQL credentials and SSH key
        env:
          BASE_DB_SYS_PASSWORD: ${{ secrets.BASE_DB_SYS_PASSWORD }}
          BASE_DB_TEST_PASSWORD: ${{ secrets.BASE_DB_TEST_PASSWORD }}
          BASE_DB_SSH_PUBLIC_KEY: ${{ vars.BASE_DB_SSH_PUBLIC_KEY }}
        run: |
          [[ -n "$BASE_DB_SYS_PASSWORD" && -n "$BASE_DB_TEST_PASSWORD" && -n "$BASE_DB_SSH_PUBLIC_KEY" ]]
          [[ "$BASE_DB_SYS_PASSWORD" != "$BASE_DB_TEST_PASSWORD" ]]
      - name: Create only the selected participant test DB in the shared Oracle RG
        env:
          BASE_DB_SYS_PASSWORD: ${{ secrets.BASE_DB_SYS_PASSWORD }}
          BASE_DB_SSH_PUBLIC_KEY: ${{ vars.BASE_DB_SSH_PUBLIC_KEY }}
        run: python3 tests/base_database.py create
      - name: Discover actual Oracle endpoints and configure narrow client SQL ingress
        env:
          OCI_COMPARTMENT_ID: ${{ vars.OCI_COMPARTMENT_ID }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: eu-paris-1
        run: |
          python3 tests/base_database.py discover
          python3 tests/base_database.py configure-network
      - name: Create private temporary hub DNS diagnostic VM
        run: python3 tests/hub_dns_diagnostic.py create
      - name: Require replicated database DNS through the resolver and firewall over UDP/TCP
        run: python3 tests/hub_dns_diagnostic.py probe
      - name: Run firewall-only participant DNS and real PDB SQL probes on the existing VM
        env:
          BASE_DB_SYS_PASSWORD: ${{ secrets.BASE_DB_SYS_PASSWORD }}
          BASE_DB_TEST_PASSWORD: ${{ secrets.BASE_DB_TEST_PASSWORD }}
        run: python3 tests/base_database.py remote
      - name: Renew OIDC login before cleanup after long-running database tests
        if: always()
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.WORKSHOP_TENANT_ID }}
          subscription-id: ${{ env.WORKSHOP_SUBSCRIPTION_ID }}
      - name: Delete only this run's owned test DB
        if: always()
        run: python3 tests/base_database.py cleanup
      - name: Delete only this run's temporary diagnostic resource group
        if: always()
        run: python3 tests/hub_dns_diagnostic.py cleanup
      - name: Remove interrupted private request file
        if: always()
        run: rm -f .base-db-request.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-db-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            base-db-run-command.json
            hub-dns-run-command.json
          if-no-files-found: warn
          retention-days: 30
