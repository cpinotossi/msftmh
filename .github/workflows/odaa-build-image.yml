# Build Oracle Workshop VM Image using Packer
# Publishes to Azure Compute Gallery for the independent user-VM deployment.
name: 0 - Build Image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Fresh image version (semver)'
        required: true
        default: '1.1.0'

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PACKER_DIR: 'infra/packer'
  PACKER_VERSION: '1.16.2'
  WORKSHOP_SUBSCRIPTION_ID: 'aca3d6b0-497a-40cc-bdd0-e8e3ef6d8483'
  ARM_TENANT_ID: '8fd3e0b6-0302-4084-a31f-1dfc5bbd03f5'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  IMAGE_RESOURCE_GROUP: 'rg-workshop-images'
  IMAGE_VERSION: ${{ inputs.image_version }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PACKER_DIR }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra/packer
          sparse-checkout-cone-mode: false

      - name: Install Packer
        run: |
          cd /tmp
          curl -fSLO "https://releases.hashicorp.com/packer/$PACKER_VERSION/packer_${PACKER_VERSION}_linux_amd64.zip"
          printf '%s  %s\n' \
            'abbfe0cf74985084112659b53e3565f264f70a20914c3b7c4f789f54f61c2414' \
            "packer_${PACKER_VERSION}_linux_amd64.zip" | sha256sum -c -
          unzip -o "packer_${PACKER_VERSION}_linux_amd64.zip"
          sudo mv packer /usr/local/bin/
          packer version

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.WORKSHOP_SUBSCRIPTION_ID }}

      - name: Check target and image prerequisites
        run: |
          test "$(az account show --query id -o tsv)" = "$WORKSHOP_SUBSCRIPTION_ID"
          test "$(az account show --query tenantId -o tsv)" = "$ARM_TENANT_ID"
          [[ "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(az sig image-definition show \
            --resource-group "$IMAGE_RESOURCE_GROUP" \
            --gallery-name gal_oracle_workshop \
            --gallery-image-definition oracle-workshop-vm \
            --query hyperVGeneration -o tsv)" = V2
          python3 check_vm_prerequisites.py build
          existing="$(az sig image-version list --resource-group "$IMAGE_RESOURCE_GROUP" \
            --gallery-name gal_oracle_workshop --gallery-image-definition oracle-workshop-vm \
            --query "[?name=='$IMAGE_VERSION'] | length(@)" -o tsv)"
          [[ "$existing" == 0 ]] ||
            { echo 'Image version already exists; choose a fresh version. No build VM created.'; exit 1; }

      - name: Ensure Build Resource Group
        run: |
          az group create \
            --name rg-packer-build \
            --location francecentral \
            --subscription "$WORKSHOP_SUBSCRIPTION_ID" \
            --tags Purpose=PackerBuild ManagedBy=CI

      - name: Packer Init
        run: packer init .

      - name: Packer Validate
        run: |
          packer validate \
            -var "subscription_id=$WORKSHOP_SUBSCRIPTION_ID" \
            -var "resource_group=$IMAGE_RESOURCE_GROUP" \
            -var "image_version=$IMAGE_VERSION" \
            .

      - name: Packer Build
        run: |
          packer build \
            -var "subscription_id=$WORKSHOP_SUBSCRIPTION_ID" \
            -var "resource_group=$IMAGE_RESOURCE_GROUP" \
            -var "image_version=$IMAGE_VERSION" \
            -color=false \
            .

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🖼️ Image Build"
            echo ""
            echo "- Version: $IMAGE_VERSION"
            echo "- Resource group: $IMAGE_RESOURCE_GROUP"
            echo "- Gallery: gal_oracle_workshop"
            echo "- Image: oracle-workshop-vm"
            if [ -f packer-manifest.json ]; then
              echo ""
              echo "### Manifest"
              echo '```json'
              cat packer-manifest.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
