name: Cleanup owned BaseDB systems - Phase B only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CLEANUP; the seven participant VMs, identities and shared hub remain'
        type: string
        required: true
      diagnostic_owner:
        description: 'Optional interrupted test run ID-attempt, e.g. 123456789-1; delete only its tagged diagnostic RG'
        type: string
        required: false

concurrency:
  group: workshop-basedb-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  WORKSHOP_TENANT_ID: 8fd3e0b6-0302-4084-a31f-1dfc5bbd03f5
  WORKSHOP_SUBSCRIPTION_ID: aca3d6b0-497a-40cc-bdd0-e8e3ef6d8483
  ODAA_SUBSCRIPTION_ID: 4ce5b5cc-e869-451f-98fc-f50448849ee0
  BASE_DB_OWNER: ${{ inputs.diagnostic_owner }}

jobs:
  phase-b-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block before Phase B without login or Oracle access
        env:
          PHASE_B_READY: ${{ vars.WORKSHOP_PHASE_B_READY }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$PHASE_B_READY" == true && "$CONFIRMATION" == CLEANUP ]] ||
            { echo 'BLOCKED: Oracle cleanup is unavailable during Phase A.'; exit 1; }

  cleanup:
    needs: phase-b-guard
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.WORKSHOP_TENANT_ID }}
          subscription-id: ${{ env.ODAA_SUBSCRIPTION_ID }}
      - name: Verify Oracle subscription tenant
        run: |
          set -euo pipefail
          [[ "$(az account show --subscription "$ODAA_SUBSCRIPTION_ID" --query tenantId -o tsv)" == "$WORKSHOP_TENANT_ID" ]]
      - name: Delete owned DB systems only
        shell: pwsh
        run: |
          ./infra/scripts/cleanup-odaa-and-destroy.ps1 `
            -SubscriptionId $env:ODAA_SUBSCRIPTION_ID -Confirm:$false
      - name: Renew OIDC for optional diagnostic recovery
        if: always() && inputs.diagnostic_owner != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.WORKSHOP_TENANT_ID }}
          subscription-id: ${{ env.WORKSHOP_SUBSCRIPTION_ID }}
      - name: Delete only the explicitly selected owned diagnostic group
        if: always() && inputs.diagnostic_owner != ''
        run: python3 tests/hub_dns_diagnostic.py cleanup
      - name: Success summary
        run: |
          echo 'Owned BaseDB systems removed. All central anchors, DNS, VNets, seven VMs and identities preserved.' >> "$GITHUB_STEP_SUMMARY"
