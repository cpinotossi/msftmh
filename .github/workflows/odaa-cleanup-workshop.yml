# Cleanup Workshop - Run after workshop ends
#
# This workflow:
# 1. Deletes ALL Oracle Autonomous Databases in rg-odaa-* resource groups
# 2. Resets ALL passwords + MFA (invalidates old credentials)
# 3. Removes user VMs by setting user_count=0 (shared resources remain)
# 4. Cleans up OCI networking (VCNs, NSGs, subnets)
#
name: 3 - Cleanup Workshop

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "CLEANUP" to confirm'
        required: true
        type: string
      skip_adb_delete:
        description: 'Skip ADB deletion (if already deleted manually)'
        required: false
        default: false
        type: boolean

concurrency:
  group: workshop-users
  cancel-in-progress: false

env:
  TF_DIR: 'infra/users'
  SCRIPTS_DIR: 'infra/scripts'
  CREDS_FILE: 'infra/user_credentials.json'
  TF_VERSION: '1.13.4'
  TF_VAR_tenant_id: ${{ vars.TF_TENANT_ID }}
  TF_VAR_mhcore_subscription_id: ${{ vars.TF_STATE_SUBSCRIPTION_ID }}
  TF_VAR_mh0_subscription_id: ${{ vars.TF_MH0_SUBSCRIPTION_ID }}
  TF_VAR_mhodaa_subscription_id: ${{ vars.TF_MHODAA_SUBSCRIPTION_ID }}
  TF_VAR_tf_state_storage: ${{ vars.TF_STATE_STORAGE }}
  TF_VAR_tf_state_rg: ${{ vars.TF_STATE_RG }}
  TF_VAR_tf_state_container: ${{ vars.TF_STATE_CONTAINER }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_REGION: ${{ vars.OCI_CLI_REGION }}

jobs:
  validate:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "CLEANUP" ]; then
            echo "::error::You must type 'CLEANUP' to confirm. Aborting."
            exit 1
          fi
          echo "✅ Cleanup confirmed"

  delete-adbs:
    name: Delete Oracle Databases
    needs: validate
    runs-on: [self-hosted, azure, container-apps, terraform]
    if: ${{ github.event.inputs.skip_adb_delete != 'true' }}
    
    steps:
      - name: Azure Login
        run: az login --identity --client-id $ARM_CLIENT_ID --allow-no-subscriptions

      - name: Find and Delete All ADBs
        run: |
          echo "🔍 Discovering Oracle Autonomous Databases..."
          
          az account set -s "$TF_VAR_mhodaa_subscription_id"
          
          ODAA_RGS=$(az group list --query "[?starts_with(name, 'rg-odaa-')].name" -o tsv)
          DELETED=0
          FAILED=0
          
          for RG in $ODAA_RGS; do
            DBS=$(az oracle-database autonomous-database list --resource-group "$RG" --query "[].name" -o tsv 2>/dev/null || true)
            for DB in $DBS; do
              echo "🗑️ Deleting ADB '$DB' in resource group '$RG'..."
              if az oracle-database autonomous-database delete \
                --name "$DB" \
                --resource-group "$RG" \
                --yes 2>&1; then
                echo "  ✅ Deleted: $DB"
                DELETED=$((DELETED + 1))
              else
                echo "  ❌ Failed to delete: $DB"
                FAILED=$((FAILED + 1))
              fi
            done
          done
          
          echo ""
          echo "📊 Summary: $DELETED deleted, $FAILED failed"
          
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED ADB deletion(s) failed"
            exit 1
          fi
          
          if [ "$DELETED" -eq 0 ]; then
            echo "ℹ️ No ADBs found — nothing to delete"
          fi

      - name: ADB Deletion Summary
        if: always()
        run: |
          echo "### Oracle ADB Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All Oracle Autonomous Databases deleted" >> $GITHUB_STEP_SUMMARY

  rotate-passwords:
    name: Reset Passwords & MFA (Invalidate)
    needs: validate
    runs-on: [self-hosted, azure, container-apps, terraform]
    
    defaults:
      run:
        working-directory: ${{ env.SCRIPTS_DIR }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra
          sparse-checkout-cone-mode: false

      - name: Azure Login
        run: az login --identity --client-id $ARM_CLIENT_ID --allow-no-subscriptions

      - name: Reset Passwords & MFA
        shell: pwsh
        run: |
          # Use template as source (contains all user UPNs and object IDs)
          $credsFile = Join-Path $env:GITHUB_WORKSPACE "${{ env.CREDS_FILE }}"
          if (-not (Test-Path $credsFile)) {
            $templateFile = Join-Path $env:GITHUB_WORKSPACE "infra/users/user_credentials.template.json"
            Write-Host "Credentials file not found, using template: $templateFile"
            Copy-Item $templateFile $credsFile
          }
          ./manage-users.ps1 `
            -Action "reset-all" `
            -CredentialsFile $credsFile `
            -EventName "cleanup-$(Get-Date -Format 'yyyy-MM-dd')"

  destroy:
    name: Destroy Infrastructure
    needs: [rotate-passwords, delete-adbs]
    if: always() && needs.rotate-passwords.result == 'success' && (needs.delete-adbs.result == 'success' || needs.delete-adbs.result == 'skipped')
    runs-on: [self-hosted, azure, container-apps, terraform]
    
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra
          sparse-checkout-cone-mode: false

      - name: Install Terraform
        run: |
          cd /tmp
          curl -sLO "https://releases.hashicorp.com/terraform/$TF_VERSION/terraform_${TF_VERSION}_linux_amd64.zip"
          unzip -o terraform_${TF_VERSION}_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform version

      - name: Azure Login
        run: |
          az login --identity --client-id $ARM_CLIENT_ID --allow-no-subscriptions
          echo "ARM_USE_MSI=true" >> $GITHUB_ENV
          echo "ARM_USE_CLI=false" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(az account show --query tenantId -o tsv)" >> $GITHUB_ENV
          echo "AZURE_CONFIG_DIR=$(mktemp -d)" >> $GITHUB_ENV

      - name: Start MSI Proxy
        run: |
          cat > /tmp/msi-proxy.py << 'PROXY'
          import http.server, urllib.request, os, re
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  q = self.path.find('?')
                  qs = self.path[q:] if q >= 0 else ''
                  qs = re.sub(r'api-version=[^&]+', 'api-version=2019-08-01', qs)
                  url = os.environ['IDENTITY_ENDPOINT'] + qs
                  req = urllib.request.Request(url)
                  req.add_header('X-IDENTITY-HEADER', os.environ['IDENTITY_HEADER'])
                  try:
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read()
                          self.send_response(200)
                          self.send_header('Content-Type', 'application/json')
                          self.end_headers()
                          self.wfile.write(body)
                  except urllib.error.HTTPError as e:
                      body = e.read()
                      self.send_response(e.code)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(body)
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', 54321), H).serve_forever()
          PROXY
          python3 /tmp/msi-proxy.py &
          sleep 1
          curl -sf "http://127.0.0.1:54321/msi/token?api-version=2019-08-01&resource=https://management.azure.com&client_id=$ARM_CLIENT_ID" | python3 -c "import sys,json; t=json.load(sys.stdin); print('MSI proxy OK, token type:', t.get('token_type','?'))"
          echo "MSI_ENDPOINT=http://127.0.0.1:54321/msi/token" >> $GITHUB_ENV
          echo "ARM_MSI_ENDPOINT=http://127.0.0.1:54321/msi/token" >> $GITHUB_ENV
          echo "IDENTITY_ENDPOINT=http://127.0.0.1:54321/msi/token" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="use_msi=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="msi_endpoint=http://127.0.0.1:54321/msi/token" \
            -backend-config="subscription_id=${{ vars.TF_STATE_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=$ARM_TENANT_ID"

      - name: Remove User VMs (user_count=0)
        run: terraform apply -auto-approve -var="user_count=0"

      - name: Destroy Test Runner
        working-directory: infra/test-runner
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="use_msi=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="msi_endpoint=http://127.0.0.1:54321/msi/token" \
            -backend-config="subscription_id=${{ vars.TF_STATE_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=$ARM_TENANT_ID"
          terraform apply -auto-approve -var="user_count=0"

      - name: Summary
        run: |
          echo "## ✅ Workshop Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Actions Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All passwords rotated (old credentials invalidated)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ User VMs removed (user_count=0)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Test runner VM removed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Shared resources preserved (Compute Gallery, ODAA VNet, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Remaining Manual Steps" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Reset MFA manually if needed (Portal → Users → Authentication methods)" >> $GITHUB_STEP_SUMMARY

  cleanup-oci:
    name: Cleanup OCI Networking
    needs: destroy
    runs-on: [self-hosted, azure, container-apps, terraform]

    defaults:
      run:
        working-directory: ${{ env.SCRIPTS_DIR }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra
          sparse-checkout-cone-mode: false

      - name: Install OCI CLI
        run: pip install -q oci-cli

      - name: Cleanup OCI VCNs and NSGs
        run: |
          chmod +x cleanup-oci-networking.sh
          DRY_RUN=false ./cleanup-oci-networking.sh

      - name: OCI Cleanup Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### OCI Networking Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Orphaned NSGs deleted" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Orphaned VCNs deleted (incl. subnets, gateways, route tables)" >> $GITHUB_STEP_SUMMARY
