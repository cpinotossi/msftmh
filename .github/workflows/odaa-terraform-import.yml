# Import existing Azure resources into Terraform remote state
# Use when resources exist in Azure but are not tracked in the remote backend
#
# Two modes:
#   1. imports input  — paste a few lines manually (small fixes)
#   2. import_file    — read from a file in the repo (bulk imports)
#
# Format per line: TERRAFORM_ADDRESS=AZURE_RESOURCE_ID
# Lines starting with # are skipped.
name: 4 - Terraform Import

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Target project directory (shared or users)'
        required: true
        type: choice
        options:
          - shared
          - users
        default: 'shared'
      import_file:
        description: 'Path to import list file in repo (e.g. lab-env/import-list.txt). Overrides imports input.'
        required: false
        type: string
        default: ''
      imports:
        description: 'Manual imports (one per line): TF_ADDRESS=AZURE_ID. Ignored when import_file is set.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (show imports but do not execute)'
        required: false
        type: boolean
        default: true

concurrency:
  group: workshop-${{ inputs.project }}
  cancel-in-progress: false

env:
  TF_DIR: '03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/resources/infra/terraform/lab-env/${{ inputs.project }}'
  TF_VERSION: '1.9.8'

jobs:
  import:
    runs-on: [self-hosted, azure, container-apps, terraform]
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/resources/infra/terraform
          sparse-checkout-cone-mode: false

      - name: Install Terraform
        run: |
          cd /tmp
          curl -sLO "https://releases.hashicorp.com/terraform/$TF_VERSION/terraform_${TF_VERSION}_linux_amd64.zip"
          unzip -o terraform_${TF_VERSION}_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform version

      - name: Azure Login
        run: |
          az login --identity --client-id $ARM_CLIENT_ID --allow-no-subscriptions
          echo "ARM_USE_MSI=true" >> $GITHUB_ENV
          echo "ARM_USE_CLI=false" >> $GITHUB_ENV
          # Hide az CLI SP session from terraform backend (it hardcodes SupportsAzureCliToken=true)
          echo "AZURE_CONFIG_DIR=$(mktemp -d)" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="use_msi=true" \
            -backend-config="client_id=$ARM_CLIENT_ID"

      - name: Parse & Import Resources
        env:
          IMPORT_FILE: ${{ inputs.import_file }}
          IMPORTS: ${{ inputs.imports }}
          DRY_RUN: ${{ inputs.dry_run }}
          TF_BASE: ${{ github.workspace }}/03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/resources/infra/terraform
        run: |
          echo "## Terraform Import" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine input source
          if [[ -n "$IMPORT_FILE" ]]; then
            FULL_PATH="$TF_BASE/$IMPORT_FILE"
            if [[ ! -f "$FULL_PATH" ]]; then
              echo "::error::Import file not found: $FULL_PATH"
              exit 1
            fi
            echo "Reading imports from file: $IMPORT_FILE"
            echo "**Source:** \`$IMPORT_FILE\`" >> $GITHUB_STEP_SUMMARY
            INPUT_DATA=$(cat "$FULL_PATH")
          elif [[ -n "$IMPORTS" ]]; then
            echo "Reading imports from workflow input"
            echo "**Source:** manual input" >> $GITHUB_STEP_SUMMARY
            INPUT_DATA="$IMPORTS"
          else
            echo "::error::No imports specified. Set either import_file or imports."
            exit 1
          fi

          TOTAL=0
          SUCCESS=0
          FAILED=0
          SKIPPED=0

          # Process each line of the imports input
          while IFS= read -r line; do
            # Skip empty lines and comments
            line=$(echo "$line" | xargs)
            [[ -z "$line" || "$line" == \#* ]] && continue

            # Split on first = sign
            TF_ADDR="${line%%=*}"
            AZURE_ID="${line#*=}"

            # Validate format
            if [[ -z "$TF_ADDR" || -z "$AZURE_ID" || "$TF_ADDR" == "$line" ]]; then
              echo "::warning::Skipping invalid line: $line"
              echo "- ⚠️ SKIP (invalid format): \`$line\`" >> $GITHUB_STEP_SUMMARY
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            TOTAL=$((TOTAL + 1))
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "[$TOTAL] Importing: $TF_ADDR"
            echo "    Azure ID: $AZURE_ID"

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "    [DRY RUN] Would import: terraform import '$TF_ADDR' '$AZURE_ID'"
              echo "- 🔍 DRY RUN: \`$TF_ADDR\`" >> $GITHUB_STEP_SUMMARY
              SKIPPED=$((SKIPPED + 1))
            else
              if terraform import "$TF_ADDR" "$AZURE_ID" 2>&1; then
                echo "    ✅ Import successful"
                echo "- ✅ \`$TF_ADDR\`" >> $GITHUB_STEP_SUMMARY
                SUCCESS=$((SUCCESS + 1))
              else
                echo "::error::Failed to import: $TF_ADDR"
                echo "- ❌ \`$TF_ADDR\` — \`$AZURE_ID\`" >> $GITHUB_STEP_SUMMARY
                FAILED=$((FAILED + 1))
              fi
            fi
          done <<< "$INPUT_DATA"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Total: $TOTAL | Success: $SUCCESS | Failed: $FAILED | Skipped: $SKIPPED"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $TOTAL | Success: $SUCCESS | Failed: $FAILED | Skipped: $SKIPPED**" >> $GITHUB_STEP_SUMMARY

          if [[ "$FAILED" -gt 0 ]]; then
            echo "::error::$FAILED import(s) failed"
            exit 1
          fi

      - name: Verify State
        if: inputs.dry_run == false
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### State after import" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform state list >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
