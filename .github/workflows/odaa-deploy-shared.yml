# Deploy Shared Infrastructure - Compute Gallery, ODAA VNets, Role Definition
# Run once before deploying users. Rarely needs re-running.
name: 1 - Deploy Shared

on:
  workflow_dispatch:

concurrency:
  group: workshop-shared
  cancel-in-progress: false

env:
  TF_DIR: '03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/resources/infra/terraform/lab-env/shared'
  TF_VERSION: '1.9.8'

jobs:
  deploy-shared:
    runs-on: [self-hosted, azure, container-apps, terraform]
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/resources/infra/terraform
          sparse-checkout-cone-mode: false

      - name: Install Terraform
        run: |
          cd /tmp
          curl -sLO "https://releases.hashicorp.com/terraform/$TF_VERSION/terraform_${TF_VERSION}_linux_amd64.zip"
          unzip -o terraform_${TF_VERSION}_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform version

      - name: Azure Login
        run: |
          az login --identity --client-id $ARM_CLIENT_ID --allow-no-subscriptions
          echo "ARM_USE_MSI=true" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Summary
        run: |
          echo "## ✅ Shared Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
