# Deploy Oracle Workshop Users - Triggered by users/terraform.tfvars commit
# Edit user_count in users/terraform.tfvars and push to deploy
# Prerequisites: Shared infrastructure must be deployed first (workflow 1)
name: 2 - Deploy Workshop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/infra/lab-env/users/terraform.tfvars'

concurrency:
  group: workshop-users
  cancel-in-progress: false

env:
  TF_DIR: '03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/infra/lab-env/users'
  TF_VERSION: '1.13.4'
  TF_VAR_tenant_id: ${{ vars.TF_TENANT_ID }}
  TF_VAR_mh0_subscription_id: ${{ vars.TF_MH0_SUBSCRIPTION_ID }}
  TF_VAR_mhodaa_subscription_id: ${{ vars.TF_MHODAA_SUBSCRIPTION_ID }}
  TF_VAR_tf_state_storage: ${{ vars.TF_STATE_STORAGE }}
  TF_VAR_tf_state_rg: ${{ vars.TF_STATE_RG }}
  TF_VAR_tf_state_container: ${{ vars.TF_STATE_CONTAINER }}

jobs:
  deploy:
    runs-on: [self-hosted, azure, container-apps, terraform]
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/infra
          sparse-checkout-cone-mode: false

      - name: Install Terraform
        run: |
          cd /tmp
          curl -sLO "https://releases.hashicorp.com/terraform/$TF_VERSION/terraform_${TF_VERSION}_linux_amd64.zip"
          unzip -o terraform_${TF_VERSION}_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform version

      - name: Azure Login
        run: |
          az login --identity --client-id $ARM_CLIENT_ID --allow-no-subscriptions
          echo "ARM_USE_MSI=true" >> $GITHUB_ENV
          echo "ARM_USE_CLI=false" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(az account show --query tenantId -o tsv)" >> $GITHUB_ENV
          # Hide az CLI SP session from terraform backend
          echo "AZURE_CONFIG_DIR=$(mktemp -d)" >> $GITHUB_ENV

      - name: Start MSI Proxy
        run: |
          # Container Apps MSI endpoint only supports api-version=2019-08-01 and requires X-IDENTITY-HEADER
          # Terraform's go-autorest sends 2018-02-01 — this proxy translates between the two
          cat > /tmp/msi-proxy.py << 'PROXY'
          import http.server, urllib.request, os, re
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  q = self.path.find('?')
                  qs = self.path[q:] if q >= 0 else ''
                  qs = re.sub(r'api-version=[^&]+', 'api-version=2019-08-01', qs)
                  url = os.environ['IDENTITY_ENDPOINT'] + qs
                  req = urllib.request.Request(url)
                  req.add_header('X-IDENTITY-HEADER', os.environ['IDENTITY_HEADER'])
                  try:
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read()
                          self.send_response(200)
                          self.send_header('Content-Type', 'application/json')
                          self.end_headers()
                          self.wfile.write(body)
                  except urllib.error.HTTPError as e:
                      body = e.read()
                      self.send_response(e.code)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(body)
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', 54321), H).serve_forever()
          PROXY
          python3 /tmp/msi-proxy.py &
          sleep 1
          curl -sf "http://127.0.0.1:54321/msi/token?api-version=2019-08-01&resource=https://management.azure.com&client_id=$ARM_CLIENT_ID" | python3 -c "import sys,json; t=json.load(sys.stdin); print('MSI proxy OK, token type:', t.get('token_type','?'))"
          echo "MSI_ENDPOINT=http://127.0.0.1:54321/msi/token" >> $GITHUB_ENV
          echo "ARM_MSI_ENDPOINT=http://127.0.0.1:54321/msi/token" >> $GITHUB_ENV
          echo "IDENTITY_ENDPOINT=http://127.0.0.1:54321/msi/token" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="use_msi=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="msi_endpoint=http://127.0.0.1:54321/msi/token" \
            -backend-config="subscription_id=${{ vars.TF_STATE_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=$ARM_TENANT_ID"

      - name: Terraform Apply
        run: terraform apply -auto-approve
      
      - name: Summary
        run: |
          echo "## ✅ Workshop Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
