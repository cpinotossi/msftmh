name: Feature Request
description: You would like to see an additional feature in an existing Microhack.
title: "[Feature] <title>"
labels: [feature, needs triage]
body:
- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an issue already exists for the feature you are requesting.
    options:
    - label: I have searched the existing issues
      required: true
- type: dropdown
  id: microhack
  attributes:
    label: Microhack
    description: Which Microhack are you reffering too?
    options:
      - Oracle Database at Azure (ODAA)
  validations:
    required: true
- type: textarea
  attributes:
    label: Feature Description
    description: A concise description of the feature you want to be added to the Microhack.
  validations:
    required: true
- type: textarea
  attributes:
    label: Anything else?
    description: |
      Links? References? Anything that will give us more context about the issue you are encountering!

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
