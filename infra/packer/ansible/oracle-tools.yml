---
# Fixed workshop toolchain, verified against official downloads on 2026-11-08.
# Shared by Packer ansible-local and the remote configuration playbook.
- name: Configure Oracle Workshop VM
  hosts: all
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: "l"
  tasks:
    - name: Wait for cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Install Ubuntu 24.04 dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - wget
          - unzip
          - zip
          - libaio1t64
          - libnsl2
          - openjdk-21-jre-headless
          - python3
          - python3-pip
          - python3-venv
          - git
          - jq
          - vim
          - nano
          - tmux
          - dnsutils
          - iputils-ping
          - traceroute
          - netcat-openbsd
          - net-tools
          - tcpdump
          - gnuplot-nox
          - linux-azure
          - initramfs-tools
          - nvme-cli
        state: present

    - name: Include NVMe drivers in every initramfs
      ansible.builtin.lineinfile:
        path: /etc/initramfs-tools/modules
        line: "{{ item }}"
        create: true
        mode: '0644'
      loop:
        - nvme
        - nvme_core

    - name: Persist Azure NVMe IO timeout for module loading
      ansible.builtin.copy:
        dest: /etc/modprobe.d/azure-nvme.conf
        content: "options nvme_core io_timeout=240\n"
        mode: '0644'

    - name: Persist Azure NVMe IO timeout on the kernel command line
      ansible.builtin.copy:
        dest: /etc/default/grub.d/99-azure-nvme.cfg
        content: 'GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX nvme_core.io_timeout=240"'
        mode: '0644'

    - name: Reject enumerated disk device names in fstab
      ansible.builtin.shell: |
        awk '
          $1 !~ /^#/ && $1 ~ /^\/dev\/(sd|hd|nvme)[a-z0-9]/ {
            print "Use UUID, LABEL or persistent /dev/disk identifiers in fstab: " $1
            invalid = 1
          }
          END { exit invalid }
        ' /etc/fstab
      changed_when: false

    - name: Rebuild initramfs for installed kernels
      ansible.builtin.command: update-initramfs -u -k all
      changed_when: true

    - name: Update boot loader configuration
      ansible.builtin.command: update-grub
      changed_when: true

    - name: Provide Oracle libaio SONAME on Ubuntu 24.04
      ansible.builtin.file:
        src: /usr/lib/x86_64-linux-gnu/libaio.so.1t64
        dest: /usr/lib/x86_64-linux-gnu/libaio.so.1
        state: link

    - name: Create installation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/oracle
        - /opt/oracle/network/admin
        - /opt/oracle/rwloadsim
        - /opt/bats
        - /opt/bats-support
        - /opt/bats-assert
        - /usr/local/lib/python3.12/dist-packages

    - name: Download fixed archives with verified SHA256 checksums
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "/tmp/{{ item.name }}"
        checksum: "sha256:{{ item.sha256 }}"
        mode: '0644'
        timeout: 120
      loop:
        - name: instantclient-basic.zip
          url: https://download.oracle.com/otn_software/linux/instantclient/2326400/instantclient-basic-linux.x64-23.26.4.0.0.zip
          sha256: cab59aa3b411b3b50898e456fa9aabfe48d67e25cbc1bb23303800390ce7de26
        - name: instantclient-sqlplus.zip
          url: https://download.oracle.com/otn_software/linux/instantclient/2326400/instantclient-sqlplus-linux.x64-23.26.4.0.0.zip
          sha256: 3cd43219cbaad59bb75cee18e7af074ada707446f13397b6f93ec7e4ca870490
        - name: sqlcl.zip
          url: https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-26.3.1.301.1413.zip
          sha256: f3f188ae06f17eb181f77ae0be54f2ae8c165e52056a7cb7401a974cace9e5f2
        - name: rwloadsim.tgz
          url: https://github.com/oracle/rwloadsim/releases/download/v3.3.0/rwloadsim-linux-x86_64-bin-3.3.0.tgz
          sha256: 7c8b38d6c4fdc358456cc45d659c74247bf0ca612a4e4b56781a1d0c85231fc1
        - name: azure-cli.deb
          url: https://packages.microsoft.com/repos/azure-cli/pool/main/a/azure-cli/azure-cli_2.92.0-1~noble_amd64.deb
          sha256: 83c994db3fdbb70368c257f575e0d181f0c8ffed7ebcd761596c8f14af678346
        - name: oracle_database-3.0.1-py3-none-any.whl
          url: https://azcliprod.blob.core.windows.net/cli-extensions/oracle_database-3.0.1-py3-none-any.whl
          sha256: 608230e55b9c80a33a5e24982529bf97f02ed84381941b9c1b1c51e5063b6ac7
        - name: bats.tar.gz
          url: https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz
          sha256: bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177
        - name: bats-support.tar.gz
          url: https://github.com/bats-core/bats-support/archive/refs/tags/v0.3.0.tar.gz
          sha256: 7815237aafeb42ddcc1b8c698fc5808026d33317d8701d5ec2396e9634e2918f
        - name: bats-assert.tar.gz
          url: https://github.com/bats-core/bats-assert/archive/refs/tags/v2.2.4.tar.gz
          sha256: e305df20c4c36cba4570e10f1cd824efb1ae71d88b5ef474550781ebee04192f

    - name: Extract Oracle client archives
      ansible.builtin.unarchive:
        src: "/tmp/{{ item }}"
        dest: /opt/oracle
        remote_src: true
      loop:
        - instantclient-basic.zip
        - instantclient-sqlplus.zip
        - sqlcl.zip

    - name: Link the exact Instant Client directory
      ansible.builtin.file:
        src: /opt/oracle/instantclient_23_26
        dest: /opt/oracle/instantclient
        state: link
        force: true

    - name: Make SQLcl readable and executable for workshop users
      ansible.builtin.command: chmod -R a+rX /opt/oracle/sqlcl
      changed_when: true

    - name: Extract rwloadsim preserving its root bin and lib directories
      ansible.builtin.unarchive:
        src: /tmp/rwloadsim.tgz
        dest: /opt/oracle/rwloadsim
        remote_src: true

    - name: Extract BATS and helpers
      ansible.builtin.unarchive:
        src: "/tmp/{{ item.archive }}"
        dest: "{{ item.dest }}"
        remote_src: true
        extra_opts: [--strip-components=1]
      loop:
        - {archive: bats.tar.gz, dest: /opt/bats}
        - {archive: bats-support.tar.gz, dest: /opt/bats-support}
        - {archive: bats-assert.tar.gz, dest: /opt/bats-assert}

    - name: Install BATS
      ansible.builtin.command: /opt/bats/install.sh /usr/local
      changed_when: true

    - name: Install the fixed Azure CLI Debian package
      ansible.builtin.apt:
        deb: /tmp/azure-cli.deb

    - name: Install the fixed Oracle Azure CLI extension for all users
      ansible.builtin.command: az extension add --system --yes --source /tmp/oracle_database-3.0.1-py3-none-any.whl
      changed_when: true

    - name: Install fixed Oracle Python driver in an isolated environment
      ansible.builtin.pip:
        name: oracledb==26.1.0
        virtualenv: /opt/oracle/python
        virtualenv_command: /usr/bin/python3 -m venv

    - name: Expose Oracle driver to system Python for root Run Command probes
      ansible.builtin.copy:
        dest: /usr/local/lib/python3.12/dist-packages/oracle-workshop.pth
        content: "/opt/oracle/python/lib/python3.12/site-packages\n"
        mode: '0644'

    - name: Install fixed OCI CLI in an isolated environment
      ansible.builtin.pip:
        name: oci-cli==3.96.0
        virtualenv: /opt/oci-cli
        virtualenv_command: /usr/bin/python3 -m venv

    - name: Expose SQL and OCI commands
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: true
      loop:
        - {src: /opt/oracle/instantclient/sqlplus, dest: /usr/local/bin/sqlplus}
        - {src: /opt/oracle/sqlcl/bin/sql, dest: /usr/local/bin/sql}
        - {src: /opt/oci-cli/bin/oci, dest: /usr/local/bin/oci}

    - name: Expose rwloadsim commands for non-login shells
      ansible.builtin.copy:
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
        content: |
          #!/bin/sh
          export PATH="/opt/oracle/rwloadsim/bin:$PATH"
          export LD_LIBRARY_PATH="/opt/oracle/instantclient:${LD_LIBRARY_PATH:-}"
          exec /opt/oracle/rwloadsim/bin/{{ item }} "$@"
      loop:
        - rwloadsim
        - connping
        - ociping

    - name: Configure Oracle dynamic linker
      ansible.builtin.copy:
        dest: /etc/ld.so.conf.d/oracle-instantclient.conf
        content: "/opt/oracle/instantclient\n"
        mode: '0644'

    - name: Update dynamic linker cache
      ansible.builtin.command: ldconfig
      changed_when: true

    - name: Configure login environment without wallet configuration
      ansible.builtin.copy:
        dest: /etc/profile.d/oracle-workshop.sh
        mode: '0644'
        content: |
          export ORACLE_BASE=/opt/oracle
          export ORACLE_HOME=/opt/oracle/instantclient
          export TNS_ADMIN=/opt/oracle/network/admin
          export LD_LIBRARY_PATH="/opt/oracle/instantclient:${LD_LIBRARY_PATH:-}"
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:/opt/oracle/instantclient:/opt/oracle/sqlcl/bin:/opt/oracle/rwloadsim/bin:/usr/local/bin:$PATH"

    - name: Create Base Database TNS example without replacing existing configuration
      ansible.builtin.copy:
        dest: /opt/oracle/network/admin/tnsnames.ora
        force: false
        mode: '0644'
        content: |
          # Use the private node alias and actual PDB service, not necessarily the PDB name.
          # BASEDB = (description=
          #   (connect_timeout=10)
          #   (address=(protocol=tcp)(port=1521)(host=basedbuserXX.basedb.workshop.internal))
          #   (connect_data=(service_name=YOUR_PDB_SERVICE))
          # )

    - name: Write workshop quick reference
      ansible.builtin.copy:
        dest: /etc/motd
        mode: '0644'
        content: |
          Oracle Database@Azure Workshop
          SQL*Plus: sqlplus -L workshop@//HOST:1521/PDB_SERVICE
          SQLcl:    sql workshop@//HOST:1521/PDB_SERVICE
          connping --help (SQL login test, not a TCP probe)
          Azure CLI: az login
          OCI CLI: oci session authenticate
          Configure the Base Database private DNS alias and actual PDB service.
          Enter passwords at the prompt, not in command history.

    - name: Verify required tools before image generalization
      ansible.builtin.command: "{{ item }}"
      changed_when: false
      loop:
        - /usr/bin/java -version
        - /usr/local/bin/sqlplus -V
        - /usr/local/bin/sql -version
        - /usr/local/bin/rwloadsim --version
        - /usr/local/bin/connping --help
        - /usr/bin/az version
        - /usr/bin/az extension show --name oracle-database
        - /usr/local/bin/oci --version
        - /usr/bin/python3 -c "import oracledb; print(oracledb.__version__)"
        - /usr/local/bin/bats --version
        - /usr/bin/dig -v

    - name: Remove downloaded archives
      ansible.builtin.file:
        path: "/tmp/{{ item }}"
        state: absent
      loop:
        - instantclient-basic.zip
        - instantclient-sqlplus.zip
        - sqlcl.zip
        - rwloadsim.tgz
        - azure-cli.deb
        - oracle_database-3.0.1-py3-none-any.whl
        - bats.tar.gz
        - bats-support.tar.gz
        - bats-assert.tar.gz

    - name: Clean apt cache
      ansible.builtin.apt:
        clean: true
